name: Build iPhone App
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode environment
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Generate premium launcher icon
        run: swift ios/tools/generate_icon.swift
      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate
          if ! command -v pod >/dev/null; then brew install cocoapods; fi
          pod install
      - name: Compile iPhone Simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/WorldVoiceTranslator.xcworkspace \
            -scheme WorldVoiceTranslator \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/.build \
            CODE_SIGNING_ALLOWED=NO build | tee ios/build.log
      - name: Launch in iPhone Simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE_ID=$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","-j","devices","available"]))
          print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone ") and d["state"]=="Shutdown"))
          PY
          )
          echo "Booting iPhone simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" ios/.build/Build/Products/Debug-iphonesimulator/WorldVoiceTranslator.app
          xcrun simctl launch "$DEVICE_ID" com.jrmorales.worldvoicetranslator
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot "$GITHUB_WORKSPACE/iPhone-Simulator-Launch.png"
          echo "Native iOS app successfully launched in simulator."
      - name: Upload simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-launch-verification
          path: iPhone-Simulator-Launch.png
          if-no-files-found: error
      - name: Package simulator build
        if: success()
        run: |
          cd ios/.build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/WorldVoiceTranslator-Simulator.zip" WorldVoiceTranslator.app
      - name: Upload simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WorldVoiceTranslator-iOS-Simulator-NOT-installable-on-iPhone
          path: WorldVoiceTranslator-Simulator.zip
          if-no-files-found: error
      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-diagnostics
          path: ios/build.log
          if-no-files-found: ignore
